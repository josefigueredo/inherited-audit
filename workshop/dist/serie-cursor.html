<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de skills</title>
<!-- Template: build inlines tokens.css + screens.css at CSS, the episodes of ONE series
     as <script type="application/json" id="episodes">[…]</script> at EPISODES, and
     nav.js, render.js, animate.js, stage.js at JS. No external references. -->
<style>
/* Every colour, font and size of the stage. When Cursor or the terminal change, edit here.
   Sizes are for the fixed 1600x900 canvas (the stage scales it). */
:root {
  /* canvas */
  --ws-w: 1600px;
  --ws-h: 900px;

  /* fonts */
  --ws-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ws-font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
  --ws-fs: 15px;          /* Cursor body text */
  --ws-fs-sm: 13.5px;     /* sidebar, tabs, footers */
  --ws-fs-xs: 12.5px;     /* section labels, ages */
  --ws-fs-h4: 19px;       /* say #### heading */
  --ws-fs-mono: 13.5px;   /* code, chips, zsh */
  --ws-fs-term: 16px;     /* personal terminal and Claude Code */
  --ws-lh: 1.6;
  --ws-lh-mono: 1.55;
  --ws-lh-tight: 1.3;     /* user label block */
  --ws-lh-list: 2;        /* file tree, Open Tabs */
  --ws-caret-w: .6em;     /* terminal caret block */

  /* spacing and radii */
  --ws-gap: 12px;
  --ws-pad: 18px;
  --ws-pad-sm: 8px;
  --ws-pad-xs: 4px;
  --ws-radius: 12px;
  --ws-radius-sm: 6px;
  --ws-radius-xs: 4px;
  --ws-line: 1px;

  /* window chrome */
  --ws-dot: 12px;
  --ws-dot-r: #ff5f57;
  --ws-dot-y: #febc2e;
  --ws-dot-g: #28c840;

  /* Cursor, light theme */
  --ws-c-bg: #ffffff;
  --ws-c-side: #f3f3f3;
  --ws-c-line: #e6e6e6;
  --ws-c-tx: #1d1d1f;
  --ws-c-tx2: #3a3a3c;
  --ws-c-mut: #7a7a7a;
  --ws-c-faint: #a0a0a0;
  --ws-c-sel: #e3e3e3;
  --ws-c-chip: #f2f2f2;
  --ws-c-code: #efefef;
  --ws-c-send-bg: #111111;
  --ws-c-send-fg: #ffffff;
  --ws-c-plus: #1a7f37;
  --ws-c-avatar: #8a7b6b;
  --ws-c-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  --ws-c-sidebar-w: 250px;
  --ws-c-right-w: 680px;
  --ws-c-tree-w: 230px;
  --ws-c-zsh-h: 400px;
  --ws-c-opentabs-w: 270px;
  --ws-c-top-h: 40px;
  --ws-c-tabs-h: 40px;
  --ws-c-avatar-s: 26px;
  --ws-c-send-s: 22px;
  --ws-c-preview-fs: 28px;

  /* zsh prompt segments inside Cursor (light) */
  --ws-z-bg: #ffffff;
  --ws-z-tx: #1d1d1f;
  --ws-z-apple-bg: #ffffff;
  --ws-z-apple-fg: #111111;
  --ws-z-path-bg: #1f4f8f;
  --ws-z-path-fg: #ffffff;
  --ws-z-git-bg: #2a8a76;
  --ws-z-git-fg: #ffffff;
  --ws-z-sys-bg: #8e1f6f;
  --ws-z-sys-fg: #ffffff;
  --ws-z-time-bg: transparent;
  --ws-z-time-fg: #1d1d1f;
  --ws-z-fill: #7a7a7a;
  --ws-z-path-icon: #ffffff;
  --ws-z-sys-icon: #ffffff;
  --ws-z-time-icon: #1d1d1f;
  --ws-z-ok: #2ea043;
  --ws-z-out: #3a3a3c;

  /* personal terminal (dark) */
  --ws-t-bg: #252830;
  --ws-t-bar: #2d3139;
  --ws-t-bar-fg: #c9ced8;
  --ws-t-tx: #d7dae0;
  --ws-t-mut: #8b919c;
  --ws-t-cmd: #79c0ff;
  --ws-t-ok: #7ee000;
  --ws-t-caret: #d7dae0;
  --ws-t-apple-bg: #d0d4db;
  --ws-t-apple-fg: #111111;
  --ws-t-path-bg: #86a6cc;
  --ws-t-path-fg: #ffffff;
  --ws-t-path-icon: #ffffff;
  --ws-t-git-bg: #2f8f8a;
  --ws-t-git-fg: #ffffff;
  --ws-t-sys-bg: #b994c9;
  --ws-t-sys-fg: #1b1b22;
  --ws-t-sys-icon: #1b1b22;
  --ws-t-time-bg: #d6d9df;
  --ws-t-time-fg: #111111;
  --ws-t-time-icon: #111111;
  --ws-t-fill: #5d6370;
  --ws-t-bar-h: 34px;
  --ws-seg-slant: 8px;
  --ws-fill-w: 2px;       /* dotted fill between prompt segments */
  --ws-icon-s: 1em;       /* prompt icons (folder, house, clock), inline SVG */
  --ws-icon-gap: .4em;    /* space between a prompt icon and its text */
  --ws-icon-drop: -.14em; /* vertical-align of prompt icons on the text baseline */

  /* Claude Code tab */
  --ws-cc-accent: #d97757;
  --ws-cc-ok: #3fb950;
  --ws-cc-user: #ffa657;  /* the person's turn, as in the cc-* mockups */
  --ws-cc-bang: #f778ba;  /* a `!` command the person runs in bash mode */
  --ws-cc-box: #5d6370;
  --ws-cc-gutter: 2ch;    /* width of the ⏺ / ⎿ / > gutter */

  /* browser window of a page step */
  --ws-p-w: 92%;
  --ws-p-h: 90%;
  --ws-p-bg: #ffffff;
  --ws-p-bar: #f1f1f3;

  /* macOS approval window */
  --ws-a-scrim: rgba(0, 0, 0, .28);
  --ws-a-bg: #ececec;
  --ws-a-tx: #1d1d1f;
  --ws-a-mut: #4a4a4c;
  --ws-a-line: #d2d2d2;
  --ws-a-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  --ws-a-w: 560px;
  --ws-a-radius: 14px;
  --ws-a-icon: 56px;
  --ws-a-icon-bg: #2d6cdf;
  --ws-a-btn-bg: #ffffff;
  --ws-a-btn-fg: #1d1d1f;
  --ws-a-ok-bg: #0a6cf0;
  --ws-a-ok-fg: #ffffff;
  --ws-a-fs-title: 17px;
  --ws-a-fs: 14px;
  --ws-a-lh: 1.45;
  /* the tool's own approval panel (alert.js): light or dark like macOS, because its page follows the system too */
  --ws-r-bg: #ececec;
  --ws-r-tx: #1d1d1f;
  --ws-r-bar-tx: #4a4a4c;
  --ws-r-btn-bg: #ffffff;
  --ws-r-btn-line: #c8c8c8;
  --ws-r-bar: 28px;         /* title bar */
  --ws-r-foot: 58px;        /* the button bar under the page (alert.js `bar`) */
  --ws-r-btn-h: 28px;
  --ws-r-btn-cancel: 90px;
  --ws-r-btn-ok: 130px;
  --ws-r-fs-btn: 13px;

  /* chapter card */
  --ws-k-grad: linear-gradient(135deg, #2d6cdf, #7a4fe0);
  --ws-k-fg: #ffffff;
  --ws-k-fs-kicker: 22px;
  --ws-k-fs-title: 88px;
  --ws-k-fs-sub: 30px;
  --ws-k-pad: 140px;
  --ws-k-sub-w: 1100px;
  --ws-k-kicker-track: .12em;
  --ws-k-kicker-op: .8;
  --ws-k-sub-op: .9;
  --ws-k-title-mt: .2em;
  --ws-k-title-mb: .3em;
  --ws-k-lh-title: 1.05;
  --ws-k-lh-sub: 1.35;
  --ws-k-pitch-mt: 56px;
  --ws-k-pitch-w: 1180px;
  --ws-k-pitch-pad: 28px 36px;
  --ws-k-pitch-bg: rgba(255, 255, 255, .12);
  --ws-k-pitch-radius: 14px;
  --ws-k-fs-pitch-k: 18px;
  --ws-k-fs-pitch: 30px;
  --ws-k-lh-pitch: 1.3;
  --ws-k-pitch-gap: 8px;
  --ws-k-pitch-row-gap: 22px;
}

/* Stage screens: card, cursor-full, cursor-agent, terminal, claude-code, approve overlay.
   Values come from tokens.css; this file only lays things out. */
.ws-screen {
  position: relative; box-sizing: border-box; width: var(--ws-w); height: var(--ws-h);
  overflow: hidden; font-family: var(--ws-font-ui);
}
.ws-screen *, .ws-screen *::before, .ws-screen *::after { box-sizing: border-box; }
.ws-empty { background: var(--ws-c-bg); }
.ws-mut { color: var(--ws-c-mut); }

/* bottom-anchored area: short content on top, long content shows its newest part */
.ws-scroll { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; }
.ws-flow { flex: 1 0 auto; }

.ws-dots { display: flex; gap: calc(var(--ws-dot) / 2); }
.ws-dot { display: inline-block; width: var(--ws-dot); height: var(--ws-dot); border-radius: 50%; }
.ws-dot-r { background: var(--ws-dot-r); }
.ws-dot-y { background: var(--ws-dot-y); }
.ws-dot-g { background: var(--ws-dot-g); }

/* ---------- chapter card ---------- */
.ws-card { background: var(--ws-k-grad); color: var(--ws-k-fg); display: flex; align-items: center; }
.ws-card-inner { padding: 0 var(--ws-k-pad); }
.ws-card-kicker { font-size: var(--ws-k-fs-kicker); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase; opacity: var(--ws-k-kicker-op); }
.ws-card-title { margin: var(--ws-k-title-mt) 0 var(--ws-k-title-mb); font-size: var(--ws-k-fs-title); line-height: var(--ws-k-lh-title); font-weight: 700; }
.ws-card-sub { margin: 0; font-size: var(--ws-k-fs-sub); opacity: var(--ws-k-sub-op); max-width: var(--ws-k-sub-w); line-height: var(--ws-k-lh-sub); }
.ws-card-pitch { margin-top: var(--ws-k-pitch-mt); max-width: var(--ws-k-pitch-w); padding: var(--ws-k-pitch-pad);
  background: var(--ws-k-pitch-bg); border-radius: var(--ws-k-pitch-radius); }
.ws-card-pitch-k { font-size: var(--ws-k-fs-pitch-k); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase;
  opacity: var(--ws-k-kicker-op); margin-bottom: var(--ws-k-pitch-gap); }
.ws-card-pitch-ask, .ws-card-pitch-does { font-size: var(--ws-k-fs-pitch); line-height: var(--ws-k-lh-pitch); }
.ws-card-pitch-ask { font-style: italic; margin-bottom: var(--ws-k-pitch-row-gap); }

/* ---------- Cursor ---------- */
.ws-cursor { display: flex; background: var(--ws-c-bg); color: var(--ws-c-tx); font-size: var(--ws-fs); line-height: var(--ws-lh); }
.ws-sb {
  width: var(--ws-c-sidebar-w); flex: none; background: var(--ws-c-side); border-right: var(--ws-line) solid var(--ws-c-line);
  display: flex; flex-direction: column; padding: var(--ws-gap) 0; font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-sb .ws-dots { padding: 0 var(--ws-gap) var(--ws-pad); }
.ws-sb-nav { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-sec { padding: var(--ws-pad) var(--ws-gap) var(--ws-pad-xs); color: var(--ws-c-mut); font-size: var(--ws-fs-xs); }
.ws-sb-repo { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-chat {
  display: flex; gap: var(--ws-pad-sm); justify-content: space-between;
  margin: 0 var(--ws-pad-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm) var(--ws-pad-xs) var(--ws-pad);
  border-radius: var(--ws-radius-sm);
}
.ws-sb-chat-t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws-sb-chat b { font-weight: 400; color: var(--ws-c-mut); flex: none; }
.ws-sb-chat.ws-on { background: var(--ws-c-sel); color: var(--ws-c-tx); }
.ws-me { margin-top: auto; padding: var(--ws-gap); display: flex; align-items: center; gap: var(--ws-pad-sm); line-height: var(--ws-lh-tight); }
.ws-avatar { width: var(--ws-c-avatar-s); height: var(--ws-c-avatar-s); border-radius: 50%; background: var(--ws-c-avatar); flex: none; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ws-top {
  height: var(--ws-c-top-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-pad);
  font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-top-r { margin-left: auto; color: var(--ws-c-mut); font-size: var(--ws-fs-xs); white-space: pre; }
.ws-conv { flex: 1; padding: 0 var(--ws-pad); }
.ws-conv .ws-flow { display: flex; flex-direction: column; gap: var(--ws-gap); padding-bottom: var(--ws-gap); }
.ws-ask {
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius); padding: var(--ws-gap) var(--ws-gap) var(--ws-pad-sm);
  box-shadow: var(--ws-c-shadow); background: var(--ws-c-bg); white-space: pre-wrap;
}
.ws-ask-row { display: flex; align-items: center; gap: var(--ws-gap); margin-top: var(--ws-pad-sm); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); white-space: normal; }
.ws-send {
  margin-left: auto; width: var(--ws-c-send-s); height: var(--ws-c-send-s); border-radius: 50%;
  background: var(--ws-c-send-bg); color: var(--ws-c-send-fg); display: flex; align-items: center; justify-content: center; font-size: var(--ws-fs-xs);
}
.ws-worked { color: var(--ws-c-mut); }
.ws-tool {
  align-self: flex-start; font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); color: var(--ws-c-tx2);
  background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm);
  white-space: pre-wrap; word-break: break-word;
}
.ws-ran { display: flex; flex-direction: column; gap: var(--ws-pad-xs); }
.ws-ran-out {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); line-height: var(--ws-lh-mono); color: var(--ws-z-out);
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-sm) var(--ws-gap);
}
.ws-ran-out .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-say p, .ws-say ul, .ws-say h4 { margin: 0 0 var(--ws-pad-sm); }
.ws-say > :last-child { margin-bottom: 0; }
.ws-say h4 { font-size: var(--ws-fs-h4); margin-top: var(--ws-pad-xs); }
.ws-say ul { padding-left: var(--ws-pad); }
.ws-md-table { overflow-x: auto; margin: 0 0 var(--ws-pad-sm); }
.ws-md-table table { border-collapse: collapse; font-size: var(--ws-fs-sm); }
.ws-md-table th, .ws-md-table td {
  border: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-pad-xs) var(--ws-pad-sm); text-align: left;
  white-space: nowrap;
}
.ws-md-table th { font-weight: 600; }
.ws-cursor code {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); background: var(--ws-c-code);
  border-radius: var(--ws-radius-xs); padding: 0 var(--ws-pad-xs);
}
.ws-followup {
  flex: none; margin: var(--ws-pad-sm) var(--ws-pad) var(--ws-pad-xs); border: var(--ws-line) solid var(--ws-c-line);
  border-radius: var(--ws-radius); padding: var(--ws-pad-sm) var(--ws-gap); display: flex; color: var(--ws-c-faint);
  font-size: var(--ws-fs-sm); box-shadow: var(--ws-c-shadow); white-space: pre;
}
.ws-followup-m { margin-left: auto; color: var(--ws-c-mut); }
.ws-foot { flex: none; display: flex; gap: var(--ws-pad); padding: var(--ws-pad-xs) var(--ws-pad) var(--ws-gap); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); }

/* right panel (cursor-full) */
.ws-rp { width: var(--ws-c-right-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); display: flex; flex-direction: column; font-size: var(--ws-fs-sm); }
.ws-rp-tabs { height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); color: var(--ws-c-mut); }
.ws-tab.ws-on { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); font-style: italic; color: var(--ws-c-tx); }
.ws-rp-sub {
  height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-gap);
  color: var(--ws-c-tx2); border-top: var(--ws-line) solid var(--ws-c-line); border-bottom: var(--ws-line) solid var(--ws-c-line); white-space: pre;
}
.ws-rp-sub-r { margin-left: auto; display: flex; gap: var(--ws-pad-sm); color: var(--ws-c-mut); }
.ws-pill { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); color: var(--ws-c-tx); }
.ws-rp-files { flex: 1; min-height: 0; display: flex; }
.ws-preview { flex: 1; padding: var(--ws-pad); }
.ws-preview h1 { margin: var(--ws-pad-sm) 0 0; font-size: var(--ws-c-preview-fs); }
.ws-tree { width: var(--ws-c-tree-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-gap) var(--ws-pad-sm); color: var(--ws-c-tx2); line-height: var(--ws-lh-list); }
.ws-tree-h { color: var(--ws-c-mut); padding: 0 var(--ws-pad-xs); }
.ws-tree-i { padding: 0 var(--ws-pad-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-zsh { height: var(--ws-c-zsh-h); flex: none; border-top: var(--ws-line) solid var(--ws-c-line); background: var(--ws-z-bg); display: flex; flex-direction: column; }
.ws-zsh-tabs { flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: var(--ws-pad-sm) var(--ws-gap) 0; color: var(--ws-c-mut); }
.ws-zsh-title { flex: none; padding: var(--ws-pad-sm) var(--ws-gap); color: var(--ws-c-tx2); }
.ws-zsh-body {
  flex: 1; padding: 0 var(--ws-gap) var(--ws-pad-sm); font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono);
  line-height: var(--ws-lh-mono); color: var(--ws-z-tx);
}

/* Open Tabs column (cursor-agent) */
.ws-opentabs { width: var(--ws-c-opentabs-w); flex: none; padding: var(--ws-c-top-h) var(--ws-pad) var(--ws-pad); color: var(--ws-c-tx2); font-size: var(--ws-fs-sm); line-height: var(--ws-lh-list); }
.ws-ot-h { color: var(--ws-c-mut); font-size: var(--ws-fs-xs); margin-top: var(--ws-gap); }
.ws-ot-h:first-child { margin-top: 0; }
.ws-plus { color: var(--ws-c-plus); }

/* ---------- shell lines (zsh in Cursor and personal terminal) ---------- */
.ws-prompt { display: flex; align-items: center; white-space: nowrap; margin-top: var(--ws-pad-xs); }
.ws-seg {
  display: inline-block; padding: 0 calc(var(--ws-seg-slant) + var(--ws-pad-xs));
  clip-path: polygon(var(--ws-seg-slant) 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%);
  margin-right: calc(var(--ws-seg-slant) / -2);
}
.ws-seg-apple { clip-path: polygon(0 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%); }
.ws-seg-fill { flex: 1; align-self: center; height: 0; margin: 0 var(--ws-pad-sm); border-bottom: var(--ws-fill-w) dotted; }
.ws-ico { display: inline-block; width: var(--ws-icon-s); height: var(--ws-icon-s); vertical-align: var(--ws-icon-drop); }
.ws-ico-folder { margin-right: var(--ws-icon-gap); }
.ws-ico-house, .ws-ico-clock { margin-left: var(--ws-icon-gap); }
.ws-path-last { font-weight: 700; }
.ws-cmdline, .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-caret { display: inline-block; width: var(--ws-caret-w); }

.ws-zsh .ws-seg-apple { background: var(--ws-z-apple-bg); color: var(--ws-z-apple-fg); }
.ws-zsh .ws-seg-path { background: var(--ws-z-path-bg); color: var(--ws-z-path-fg); }
.ws-zsh .ws-seg-git { background: var(--ws-z-git-bg); color: var(--ws-z-git-fg); }
.ws-zsh .ws-seg-sys { background: var(--ws-z-sys-bg); color: var(--ws-z-sys-fg); }
.ws-zsh .ws-seg-time { background: var(--ws-z-time-bg); color: var(--ws-z-time-fg); }
.ws-zsh .ws-seg-fill { color: var(--ws-z-fill); }
.ws-zsh .ws-ico-folder { color: var(--ws-z-path-icon); }
.ws-zsh .ws-ico-house { color: var(--ws-z-sys-icon); }
.ws-zsh .ws-ico-clock { color: var(--ws-z-time-icon); }
.ws-zsh .ws-caret-prompt { color: var(--ws-z-ok); font-weight: 700; }
.ws-zsh .ws-out { color: var(--ws-z-out); }
.ws-zsh .ws-caret { outline: var(--ws-line) solid var(--ws-z-tx); }

/* ---------- terminal theme (personal terminal and Claude Code) ---------- */
.ws-term-theme { background: var(--ws-t-bg); color: var(--ws-t-tx); display: flex; flex-direction: column; font-size: var(--ws-fs-term); }
.ws-tbar {
  height: var(--ws-t-bar-h); flex: none; background: var(--ws-t-bar); color: var(--ws-t-bar-fg); display: flex;

dding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}\nth{background:var(--code-bg);font-weight:700;white-space:nowrap}\ntr:last-child td{border-bottom:none}\ntd.c{text-align:center}\n.callout{border-radius:10px;padding:12px 16px;margin:14px 0;border:1px solid;box-shadow:var(--shadow)}\n.callout\u003estrong:first-child{display:block;margin-bottom:2px}\n.callout.ok{background:var(--ok-bg);border-color:var(--ok)}\n.callout.warn{background:var(--warn-bg);border-color:var(--warn)}\n.callout.bad{background:var(--bad-bg);border-color:var(--bad)}\n.callout.info{background:var(--info-bg);border-color:var(--info)}\n.callout p{margin:.3rem 0}\n.callout ul{margin:.3rem 0 0;padding-left:1.2rem}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}\n.card p{margin:.35rem 0}\n.kpis .card{padding:12px 16px}.kpis .card p{margin:0}.kpis .kpi-n{font-size:1.6rem;font-weight:800;line-height:1.2;margin-bottom:4px}\ndetails{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0;padding:2px 14px}\nsummary{cursor:pointer;font-weight:700;padding:10px 0}\ndetails[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}\nfigure{margin:16px 0}\nfigcaption{color:var(--muted);font-size:.85rem;margin-top:4px}\n.pill{background:var(--code-bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.82rem}\n.who{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--code-bg);border:1px solid var(--line);white-space:nowrap}\n.ref{color:var(--muted);font-size:.85em}\na.cite{text-decoration:none;white-space:normal}\na.cite code{border-bottom:1px dashed var(--accent);color:var(--accent)}\na.cite:hover code{background:var(--accent-soft)}\na.cite::after{content:\"\\2197\";font-size:.75em;margin-left:2px;color:var(--accent)}\n\n/* severity badge */\n.verdict{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.03em;text-transform:uppercase}\n.verdict.high{background:var(--high-bg);color:var(--high)}\n.verdict.medium{background:var(--medium-bg);color:var(--medium)}\n.verdict.low{background:var(--low-bg);color:var(--low)}\n.verdict.na{background:var(--line);color:var(--muted)}\n.sev{margin:-4px 0 10px}\n\n/* finding card */\n.issue{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:20px 0;box-shadow:var(--shadow)}\n.issue header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.issue header h3{margin:0}\n.issue-n{font:700 14px ui-monospace,Menlo,monospace;background:var(--ink);color:var(--panel);border-radius:6px;padding:2px 8px}\n.issue h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 0 6px}\n.meta{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px;color:var(--muted);margin:10px 0 0}.meta dt{font-weight:600}.meta dd{margin:0}\nfigure.code{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}\nfigure.code figcaption{font:12px ui-monospace,Menlo,monospace;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--code-bg);margin:0}\nfigure.code pre{margin:0;padding:8px 0;border:0;border-radius:0;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);color:var(--ink)}\nfigure.code pre span{display:block;padding:0 12px;white-space:pre}pre .ln i{display:inline-block;width:3.5em;color:var(--muted);font-style:normal;user-select:none}\npre .hl{background:var(--hl)}pre .add{background:var(--add)}pre .del{background:var(--del)}pre .hunk{color:var(--muted)}pre .file{font-weight:700;padding-top:6px}\n.out pre{padding:8px 12px;white-space:pre}.out.red figcaption{color:var(--red)}.out.green figcaption{color:var(--green)}\npre.cmd{font:12.5px/1.5 ui-monospace,Menlo,monospace;padding:8px 10px;white-space:pre;overflow-x:auto}\n.nota{font-size:14px;color:var(--muted)}\n.aviso{color:var(--medium)}\n.tests td:first-child{word-break:break-all}\n.issue p,.issue li,.issue dd,.callout{overflow-wrap:anywhere}\n\n@media (max-width:900px){\n  .layout{grid-template-columns:1fr}\n  nav.side{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}\n  nav.side ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}\n  nav.side ol ol{display:none}\n  nav.side .side-foot{position:static;margin-top:18px}\n}\n@media (max-width:640px){.meta{grid-template-columns:1fr}.issue{padding:16px 14px}}\n@media print{nav.side{display:none}.layout{display:block}.issue{break-inside:avoid-page}}\n\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"layout\"\u003e\n\u003cnav class=\"side\" aria-label=\"Índice\"\u003e\n  \u003cdiv class=\"brand\"\u003emi-servicio\u003csmall\u003eauditoría de sistema heredado\u003c/small\u003e\u003c/div\u003e\n  \u003col id=\"toc\"\u003e\n    \u003cli\u003e\u003ca href=\"#summary\"\u003eEn una pantalla\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#cat-pedidos\"\u003epedidos\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#how\"\u003eCómo se hizo\u003c/a\u003e\u003c/li\u003e\n  \u003c/ol\u003e\n  \u003cdiv class=\"side-foot\"\u003e\u003cdiv class=\"foot-row\"\u003e\u003cspan class=\"ver\"\u003eGenerado el 2026-10-22 con ia.py render\u003c/span\u003e\n    \u003cbutton class=\"theme-toggle\" type=\"button\" title=\"Cambiar tema\" aria-label=\"Cambiar tema\"\u003e\u0026#9680;\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/nav\u003e\n\u003cmain\u003e\n\u003cheader class=\"hero\"\u003e\n  \u003ch1\u003eHallazgos de corrección en mi-servicio\u003c/h1\u003e\n  \u003cp\u003eRevisión de API, ROOT sobre la base fijada. Cada hallazgo trae el código afectado en esa base y, cuando se pudo probar, un test que falla en esa base y una propuesta escrita de corrección.\u003c/p\u003e\n\u003c/header\u003e\n\u003csection id=\"summary\"\u003e\n\u003ch2\u003eEn una pantalla\u003c/h2\u003e\n\u003cdiv class=\"cards kpis\"\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e1\u003c/p\u003e\u003cp\u003ehallazgos en este informe\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e0\u003c/p\u003e\u003cp\u003ede severidad alta\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e1\u003c/p\u003e\u003cp\u003ecategorías\u003c/p\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cp class=\"lead\"\u003eSe muestran 1 de 2. Los demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003cdiv class=\"callout info\"\u003e\u003cstrong\u003eCómo leer este informe\u003c/strong\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eSeveridad\u003c/b\u003e, con un criterio fijo. \u003cb\u003eAlta:\u003c/b\u003e expone datos o credenciales a quien no debería, corrompe datos, o rompe una función entera. \u003cb\u003eMedia:\u003c/b\u003e produce un resultado incorrecto que se nota, o expone información menor. \u003cb\u003eBaja:\u003c/b\u003e robustez, observabilidad o una inconsistencia visible sin pérdida.\u003c/li\u003e\u003cli\u003e\u003cb\u003eTest en rojo:\u003c/b\u003e «falla en la base» dice cuántos casos del test fallan sobre la base fijada; la rama del hallazgo trae solo ese test. Los links llevan a las líneas citadas en la base fijada.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eHallazgo\u003c/th\u003e\u003cth\u003eCategoría\u003c/th\u003e\u003cth\u003eSeveridad\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eC-01\u003c/td\u003e\u003ctd\u003e\u003ca href=\"#f-c-01\"\u003eUn descuento de más del 100% deja el total del pedido negativo\u003c/a\u003e\u003c/td\u003e\u003ctd\u003epedidos\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"verdict medium\"\u003emedia\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection id=\"cat-pedidos\" class=\"cat\" data-category=\"pedidos\"\u003e\n\u003ch2\u003epedidos\u003c/h2\u003e\n\u003carticle class=\"issue\" id=\"f-c-01\"\u003e\n\u003cheader\u003e\u003cspan class=\"issue-n\"\u003eC-01\u003c/span\u003e\u003ch3\u003eUn descuento de más del 100% deja el total del pedido negativo\u003c/h3\u003e\u003cspan class=\"verdict medium\"\u003emedia\u003c/span\u003e\u003c/header\u003e\n\u003cdl class=\"meta\"\u003e\u003cdt\u003eCategoría\u003c/dt\u003e\u003cdd\u003epedidos\u003c/dd\u003e\u003cdt\u003eConfianza\u003c/dt\u003e\u003cdd\u003eprobado al ejecutarlo\u003c/dd\u003e\u003cdt\u003eRama\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003efix/c-01-descuento-sin-tope\u003c/code\u003e\u003c/dd\u003e\u003c/dl\u003e\n\u003ch4\u003eQué pasa\u003c/h4\u003e\u003cp\u003eSi un pedido recibe un descuento mayor al 100%, el total queda por debajo de cero.\u003c/p\u003e\n\n\u003ch4\u003eEvidencia en la base\u003c/h4\u003e\n\u003cfigure class=\"code\"\u003e\u003cfigcaption\u003e\u003ccode\u003eAPI/mi_servicio/orders.py:12-16\u003c/code\u003e · no hay tope en discount_pct\u003c/figcaption\u003e\u003cpre\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e9\u003c/i\u003e    return ORDERS[order_id]\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e10\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e11\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e12\u003c/i\u003edef order_total(order_id, discount_pct=0):\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e13\u003c/i\u003e    \u0026quot;\u0026quot;\u0026quot;Total of an order after a percentage discount.\u0026quot;\u0026quot;\u0026quot;\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e14\u003c/i\u003e    order = ORDERS[order_id]\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e15\u003c/i\u003e    gross = sum(price * qty for price, qty in order[\u0026quot;items\u0026quot;])\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e16\u003c/i\u003e    return gross - gross * discount_pct / 100\u003c/span\u003e\u003c/pre\u003e\u003c/figure\u003e\n\u003ch4\u003eReproducción\u003c/h4\u003e\n\u003cp\u003eorder_total() da -50.0 con 150% de descuento\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable class=\"tests\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eArchivo\u003c/th\u003e\u003cth\u003eFalla en la base\u003c/th\u003e\u003cth\u003eNota\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eapi/tests/test_discount_cap.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e1 of 1 fail\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4\u003ePropuesta\u003c/h4\u003e\u003cp\u003eLimitar el descuento entre 0 y 100 antes de calcular el total.\u003c/p\u003e\n\u003c/article\u003e\n\u003c/section\u003e\n\u003csection id=\"how\"\u003e\n\u003ch2\u003eCómo se hizo\u003c/h2\u003e\n\u003cp\u003eSe leyó cada repo en un commit fijo; todo lo citado sale de ese commit, no del árbol de trabajo.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRepo\u003c/th\u003e\u003cth\u003eBase\u003c/th\u003e\u003cth\u003eRemoto\u003c/th\u003e\u003cth\u003eCarpeta\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAPI\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003eapi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eROOT\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eQuién revisó cada paso: las herramientas externas por nombre y, si no hubo, la revisión propia.\u003c/p\u003e\n\u003cp\u003eModelo autor: \u003ccode\u003eGPT-5.6 Terra\u003c/code\u003e\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePaso\u003c/th\u003e\u003cth\u003eQuién lo hizo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ecorrección\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003e/review-bugbot\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecalidad\u003c/td\u003e\u003ctd\u003erevisión propia\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtraste\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003eSonnet 5.5 High\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eUn segundo modelo revisó cada hallazgo; si es de la misma familia que el autor, el contraste vale menos y se dice.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eModelo de contraste\u003c/th\u003e\u003cth\u003eFamilia\u003c/th\u003e\u003cth\u003eVeredicto\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ca href=\"#f-c-01\"\u003eC-01\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eSonnet 5.5 High\u003c/code\u003e\u003c/td\u003e\u003ctd\u003emisma familia: no\u003c/td\u003e\u003ctd\u003ecoincide\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eLo que pasó el filtro:\u003c/p\u003e\u003cul\u003e\u003cli\u003eCorrección: se muestran 1 de 2\u003c/li\u003e\u003cli\u003eCalidad: se muestran 1 de 1\u003c/li\u003e\u003c/ul\u003e\n\u003cp class=\"nota\"\u003eLos demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(function () {\n  var root = document.documentElement;\n  var btn = document.querySelector(\".theme-toggle\");\n  try { var saved = localStorage.getItem(\"ia-theme\"); if (saved) { root.setAttribute(\"data-theme\", saved); } } catch (e) {}\n  if (btn) {\n    btn.addEventListener(\"click\", function () {\n      var dark = root.getAttribute(\"data-theme\") === \"dark\" ||\n        (!root.getAttribute(\"data-theme\") \u0026\u0026 window.matchMedia(\"(prefers-color-scheme: dark)\").matches);\n      var next = dark ? \"light\" : \"dark\";\n      root.setAttribute(\"data-theme\", next);\n      try { localStorage.setItem(\"ia-theme\", next); } catch (e) {}\n    });\n  }\n  var links = Array.prototype.slice.call(document.querySelectorAll(\"#toc \u003e li \u003e a\"));\n  if (!(\"IntersectionObserver\" in window) || !links.length) { return; }\n  var byId = {};\n  links.forEach(function (a) { byId[a.getAttribute(\"href\").slice(1)] = a; });\n  var obs = new IntersectionObserver(function (entries) {\n    entries.forEach(function (en) {\n      if (en.isIntersecting \u0026\u0026 byId[en.target.id]) {\n        links.forEach(function (a) { a.classList.remove(\"active\"); });\n        byId[en.target.id].classList.add(\"active\");\n      }\n    });\n  }, { rootMargin: \"0px 0px -70% 0px\" });\n  Object.keys(byId).forEach(function (id) { var el = document.getElementById(id); if (el) { obs.observe(el); } });\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"type":"page","title":"~/auditorias/mi-servicio/mi-servicio-quality.html","source":"real","capture":"~/auditorias/mi-servicio/mi-servicio-quality.html","notes":"E :700 14px ui-monospace,Menlo,monospace;background:var(--ink);color:var(--panel);border-radius:6px;padding:2px 8px}\n.issue h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 0 6px}\n.meta{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px;color:var(--muted);margin:10px 0 0}.meta dt{font-weight:600}.meta dd{margin:0}\nfigure.code{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}\nfigure.code figcaption{font:12px ui-monospace,Menlo,monospace;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--code-bg);margin:0}\nfigure.code pre{margin:0;padding:8px 0;border:0;border-radius:0;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);color:var(--ink)}\nfigure.code pre span{display:block;padding:0 12px;white-space:pre}pre .ln i{display:inline-block;width:3.5em;color:var(--muted);font-style:normal;user-select:none}\npre .hl{background:var(--hl)}pre .add{background:var(--add)}pre .del{background:var(--del)}pre .hunk{color:var(--muted)}pre .file{font-weight:700;padding-top:6px}\n.out pre{padding:8px 12px;white-space:pre}.out.red figcaption{color:var(--red)}.out.green figcaption{color:var(--green)}\npre.cmd{font:12.5px/1.5 ui-monospace,Menlo,monospace;padding:8px 10px;white-space:pre;overflow-x:auto}\n.nota{font-size:14px;color:var(--muted)}\n.aviso{color:var(--medium)}\n.tests td:first-child{word-break:break-all}\n.issue p,.issue li,.issue dd,.callout{overflow-wrap:anywhere}\n\n@media (max-width:900px){\n  .layout{grid-template-columns:1fr}\n  nav.side{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}\n  nav.side ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}\n  nav.side ol ol{display:none}\n  nav.side .side-foot{position:static;margin-top:18px}\n}\n@media (max-width:640px){.meta{grid-template-columns:1fr}.issue{padding:16px 14px}}\n@media print{nav.side{display:none}.layout{display:block}.issue{break-inside:avoid-page}}\n\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"layout\"\u003e\n\u003cnav class=\"side\" aria-label=\"Índice\"\u003e\n  \u003cdiv class=\"brand\"\u003emi-servicio\u003csmall\u003eauditoría de sistema heredado\u003c/small\u003e\u003c/div\u003e\n  \u003col id=\"toc\"\u003e\n    \u003cli\u003e\u003ca href=\"#summary\"\u003eEn una pantalla\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#start-here\"\u003ePor dónde empezar\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#cat-estadisticas\"\u003eestadisticas\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#how\"\u003eCómo se hizo\u003c/a\u003e\u003c/li\u003e\n  \u003c/ol\u003e\n  \u003cdiv class=\"side-foot\"\u003e\u003cdiv class=\"foot-row\"\u003e\u003cspan class=\"ver\"\u003eGenerado el 2026-10-22 con ia.py render\u003c/span\u003e\n    \u003cbutton class=\"theme-toggle\" type=\"button\" title=\"Cambiar tema\" aria-label=\"Cambiar tema\"\u003e\u0026#9680;\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/nav\u003e\n\u003cmain\u003e\n\u003cheader class=\"hero\"\u003e\n  \u003ch1\u003eCalidad y arquitectura de mi-servicio\u003c/h1\u003e\n  \u003cp\u003eRevisión de API, ROOT sobre la base fijada. Deja de lado los bugs: busca deficiencias de calidad y de arquitectura, y para cada una dice dónde está, por qué importa y qué cambiar.\u003c/p\u003e\n\u003c/header\u003e\n\u003csection id=\"summary\"\u003e\n\u003ch2\u003eEn una pantalla\u003c/h2\u003e\n\u003cdiv class=\"cards kpis\"\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e1\u003c/p\u003e\u003cp\u003ehallazgos en este informe\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e0\u003c/p\u003e\u003cp\u003ede severidad alta\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e1\u003c/p\u003e\u003cp\u003ecategorías\u003c/p\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cp class=\"lead\"\u003eSe muestran 1 de 1. Los demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003cdiv class=\"callout info\"\u003e\u003cstrong\u003eCómo leer este informe\u003c/strong\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eSeveridad\u003c/b\u003e, con un criterio fijo. \u003cb\u003eAlta:\u003c/b\u003e expone datos o credenciales a quien no debería, corrompe datos, o rompe una función entera. \u003cb\u003eMedia:\u003c/b\u003e produce un resultado incorrecto que se nota, o expone información menor. \u003cb\u003eBaja:\u003c/b\u003e robustez, observabilidad o una inconsistencia visible sin pérdida.\u003c/li\u003e\u003cli\u003e\u003cb\u003eEsfuerzo:\u003c/b\u003e S es un cambio chico y local, M toca varios archivos, L pide rediseñar una parte. Los links llevan a las líneas citadas en la base fijada.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eHallazgo\u003c/th\u003e\u003cth\u003eCategoría\u003c/th\u003e\u003cth\u003eSeveridad\u003c/th\u003e\u003cth\u003eEsfuerzo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eQ-01\u003c/td\u003e\u003ctd\u003e\u003ca href=\"#f-q-01\"\u003eLa paginación dice empezar en 1 pero empieza en 0\u003c/a\u003e\u003c/td\u003e\u003ctd\u003eestadisticas\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"verdict low\"\u003ebaja\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eS\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection id=\"start-here\"\u003e\n\u003ch2\u003ePor dónde empezar\u003c/h2\u003e\n\u003cp class=\"lead\"\u003eLo de mayor severidad y menor esfuerzo primero.\u003c/p\u003e\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eHallazgo\u003c/th\u003e\u003cth\u003eSeveridad\u003c/th\u003e\u003cth\u003eEsfuerzo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eQ-01\u003c/td\u003e\u003ctd\u003e\u003ca href=\"#f-q-01\"\u003eLa paginación dice empezar en 1 pero empieza en 0\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"verdict low\"\u003ebaja\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eS\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection id=\"cat-estadisticas\" class=\"cat\" data-category=\"estadisticas\"\u003e\n\u003ch2\u003eestadisticas\u003c/h2\u003e\n\u003carticle class=\"issue\" id=\"f-q-01\"\u003e\n\u003cheader\u003e\u003cspan class=\"issue-n\"\u003eQ-01\u003c/span\u003e\u003ch3\u003eLa paginación dice empezar en 1 pero empieza en 0\u003c/h3\u003e\u003cspan class=\"verdict low\"\u003ebaja\u003c/span\u003e\u003c/header\u003e\n\u003cp class=\"sev\"\u003eestadisticas · esfuerzo S\u003c/p\u003e\n\u003ch4\u003eQué pasa\u003c/h4\u003e\u003cp\u003eLa documentación de paginate() y su cálculo no coinciden en cuál es la primera página.\u003c/p\u003e\n\n\u003ch4\u003eEvidencia en la base\u003c/h4\u003e\n\u003cfigure class=\"code\"\u003e\u003cfigcaption\u003e\u003ccode\u003eAPI/mi_servicio/stats.py:9-12\u003c/code\u003e · page * size: la primera página es la 0\u003c/figcaption\u003e\u003cpre\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e6\u003c/i\u003e    return sum(values) / len(values)\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e7\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e8\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e9\u003c/i\u003edef paginate(items, page, size):\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e10\u003c/i\u003e    \u0026quot;\u0026quot;\u0026quot;Return the items of a 1-based page.\u0026quot;\u0026quot;\u0026quot;\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e11\u003c/i\u003e    start = page * size\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e12\u003c/i\u003e    return items[start:start + size]\u003c/span\u003e\u003c/pre\u003e\u003c/figure\u003e\n\u003ch4\u003eSugerencia\u003c/h4\u003e\u003cp\u003eDecidir si la primera página es la 0 o la 1, corregir el docstring o el cálculo y sumar un test de la página 1.\u003c/p\u003e\n\u003c/article\u003e\n\u003c/section\u003e\n\u003csection id=\"how\"\u003e\n\u003ch2\u003eCómo se hizo\u003c/h2\u003e\n\u003cp\u003eSe leyó cada repo en un commit fijo; todo lo citado sale de ese commit, no del árbol de trabajo.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRepo\u003c/th\u003e\u003cth\u003eBase\u003c/th\u003e\u003cth\u003eRemoto\u003c/th\u003e\u003cth\u003eCarpeta\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAPI\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003eapi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eROOT\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eQuién revisó cada paso: las herramientas externas por nombre y, si no hubo, la revisión propia.\u003c/p\u003e\n\u003cp\u003eModelo autor: \u003ccode\u003eGPT-5.6 Terra\u003c/code\u003e\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePaso\u003c/th\u003e\u003cth\u003eQuién lo hizo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ecorrección\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003e/review-bugbot\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecalidad\u003c/td\u003e\u003ctd\u003erevisión propia\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtraste\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003eSonnet 5.5 High\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eUn segundo modelo revisó cada hallazgo; si es de la misma familia que el autor, el contraste vale menos y se dice.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eModelo de contraste\u003c/th\u003e\u003cth\u003eFamilia\u003c/th\u003e\u003cth\u003eVeredicto\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ca href=\"#f-q-01\"\u003eQ-01\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eSonnet 5.5 High\u003c/code\u003e\u003c/td\u003e\u003ctd\u003emisma familia: no\u003c/td\u003e\u003ctd\u003ecoincide\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eLo que pasó el filtro:\u003c/p\u003e\u003cul\u003e\u003cli\u003eCorrección: se muestran 1 de 2\u003c/li\u003e\u003cli\u003eCalidad: se muestran 1 de 1\u003c/li\u003e\u003c/ul\u003e\n\u003cp class=\"nota\"\u003eLos demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(function () {\n  var root = document.documentElement;\n  var btn = document.querySelector(\".theme-toggle\");\n  try { var saved = localStorage.getItem(\"ia-theme\"); if (saved) { root.setAttribute(\"data-theme\", saved); } } catch (e) {}\n  if (btn) {\n    btn.addEventListener(\"click\", function () {\n      var dark = root.getAttribute(\"data-theme\") === \"dark\" ||\n        (!root.getAttribute(\"data-theme\") \u0026\u0026 window.matchMedia(\"(prefers-color-scheme: dark)\").matches);\n      var next = dark ? \"light\" : \"dark\";\n      root.setAttribute(\"data-theme\", next);\n      try { localStorage.setItem(\"ia-theme\", next); } catch (e) {}\n    });\n  }\n  var links = Array.prototype.slice.call(document.querySelectorAll(\"#toc \u003e li \u003e a\"));\n  if (!(\"IntersectionObserver\" in window) || !links.length) { return; }\n  var byId = {};\n  links.forEach(function (a) { byId[a.getAttribute(\"href\").slice(1)] = a; });\n  var obs = new IntersectionObserver(function (entries) {\n    entries.forEach(function (en) {\n      if (en.isIntersecting \u0026\u0026 byId[en.target.id]) {\n        links.forEach(function (a) { a.classList.remove(\"active\"); });\n        byId[en.target.id].classList.add(\"active\");\n      }\n    });\n  }, { rootMargin: \"0px 0px -70% 0px\" });\n  Object.keys(byId).forEach(function (id) { var el = document.getElementById(id); if (el) { obs.observe(el); } });\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"type":"say","md":"#### Listo\n- Corrida y reportes en `~/auditorias/mi-servicio`: `mi-servicio-correctness.html` y `mi-servicio-quality.html`.\n- Correctitud: **se muestra 1 de 2**. C-02 (la carrera en el contador) quedó sin verificar y afuera.\n- Calidad: **se muestra 1 de 1**.\n- Una rama local, `fix/c-01-descuento-sin-tope`, sin push.\n- Pasadas propias en vez de obreros externos: estático (sin semgrep, gitleaks ni osv-scanner), calidad (sin wshobson/agents) y contraste (sin el CLI `agent`).\n- Contraste: **Sonnet 5.5 High** revisó lo que escribí yo (**GPT-5.6 Terra**), un modelo de **otra familia**, y el reporte dice quién contrastó a quién.\n- Pendiente: los tests nuevos (paso 1.5), como pediste; sin superpowers, con la pasada propia.","source":"inferido","notes":"Leé el cierre: dónde están los reportes, cuánto se muestra de cuánto, qué rama quedó (local), qué pasos usaron la pasada propia, quién contrastó a quién y qué falta. Nada se publicó.","pause":true}]},{"id":"probar-un-hallazgo","title":"Probar un hallazgo","subtitle":"Un test que falla, no una opinión","screen":"cursor-agent","faq":[{"q":"¿Y si el bug no se puede probar con un test?","a":"Se descarta con el motivo, o queda como candidato y fuera del reporte. Es un resultado válido: el reporte solo dice lo que se probó."},{"q":"¿Por qué no arregla el bug directamente?","a":"Porque el sistema es de otro equipo. La skill deja el test rojo y la propuesta escrita; el arreglo lo decide y lo hace el equipo dueño."},{"q":"¿Qué pasa con problemas de configuración o de CI?","a":"No llevan rama: se confirman con el comando que se corrió y su salida guardada, o con documentación."}],"steps":[{"type":"ask","text":"¿Cómo sé que el C-01 es real y no una opinión?","source":"inferido","notes":"Es la pregunta que va a hacer el equipo dueño. Si la skill la contesta con evidencia, el reporte se acepta sin discusión."},{"type":"term","cmd":"git -C ~/mi-servicio diff --stat main fix/c-01-descuento-sin-tope","out":[" api/tests/test_discount_cap.py | 12 ++++++++++++"," 1 file changed, 12 insertions(+)"],"source":"real","cwd":"~","notes":"La rama del hallazgo cambia un solo archivo, y es un test. Ni una línea de código de producción."},{"type":"term","cmd":"grep AssertionError ~/auditorias/mi-servicio/outputs/C-01-red.txt","out":["AssertionError: -50.0 not greater than or equal to 0"],"source":"real","cwd":"~","notes":"Y esta es la salida guardada del test: falla por la aserción, en el commit fijado. Cualquiera puede reproducirla."},{"type":"say","md":"La rama `fix/c-01-descuento-sin-tope` tiene **un commit, solo con el test**, y falla en la base por una aserción: `order_total()` devuelve -50.0.\n\nEl arreglo queda como propuesta escrita en el hallazgo: limitar el descuento entre 0 y 100. **No lo aplico**: lo decide el equipo dueño.","source":"inferido","notes":"Remarcá las dos reglas: rojo por la razón correcta (un import roto no cuenta) y la skill nunca arregla. Eso es l <script>
// Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  function keyAction(key) {
    if (key === "ArrowRight" || key === "PageDown") return "right";
    if (key === "ArrowLeft" || key === "PageUp") return "left";
    if (key === " " || key === "Spacebar") return "space";
    if (key === "b" || key === "B") return "b";
    return null;
  }

  function position(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var e = flat[i] || {chapter: 0, step: -1};
    var ch = (ep.chapters || [])[e.chapter] || {};
    return {chapter: e.chapter, step: e.step, total: flat.length, chapterTitle: ch.title};
  }

  return {flatten: flatten, clamp: clamp, nextChapter: nextChapter,
          prevChapter: prevChapter, position: position, keyAction: keyAction};
})();

</script>
<script>
// Static render of the stage: Render.step(container, episode, index) replaces the
// container's content with the FINISHED state of global index `index` (see nav.js).
// Pure function of (episode, index): nothing is kept between calls.
//
// Screens are laid out for a fixed 1600x900 canvas (.ws-screen); the stage scales it.
// All episode text goes through textContent / createTextNode; `say` markdown is parsed
// into DOM nodes, never assigned as HTML.
//
// Animation hooks (for animate.js, which renders the finished state, hides, reveals):
//   data-step="<j>"      on the root node of every applied step (j = index of the step
//                        inside its chapter). Nothing else carries data-step. Steps may
//                        live in different areas (a cursor-full term with `in: "zsh"`
//                        sits in the zsh panel, approve is an overlay at the end of the
//                        screen root), so document order is not step order: select by value.
//   data-anim="type"     the element holding exactly the text that gets typed
//                        (ask text, term command).
//   data-anim="line"     an output line, a say paragraph / heading / list item; revealed
//                        one at a time.
//   data-anim="node"     tool, worked and approve nodes (and the "▸ Ran · cmd" chip and
//                        the "⏺ Bash(cmd)" line); revealed whole.
//   hidden               an approve step that is not the current index keeps its node
//                        (so the step count holds) but is hidden: the window closed.
//   data-anim="idle"     the wrapper of the waiting prompt (prompt line + "❯ █") at the
//                        end of the terminal and of the cursor-full zsh panel. It is not
//                        a step: hide it while a term step animates, show it at the end.
//
// Prompt clock: every prompt shows Render.now() as HH:MM:SS (local time) in a
// .ws-time span. Render.now defaults to `new Date()`; tests and render-preview replace it
// with a fixed date so the output stays deterministic. The stage refreshes only the idle
// prompt's .ws-time every second (Stage.tickClock); steps are never re-rendered for it.
// Prompt icons (folder, house, clock) are inline SVG built with createElementNS.
// Unmarked descendants of a step root appear with the root; hooks inside one root are
// revealed in document order. Chapter cards carry no hooks and appear whole.
//
// Term placement on cursor-full: by default a term step is the agent's command and
// renders in the conversation exactly as on cursor-agent ("▸ Ran · cmd" chip + output
// block). With `in: "zsh"` it is a command the person types and renders in the
// integrated zsh (prompt, typed command, output lines).
// The first chapter card also shows the episode pitch («Le decís al agente…» /
// «Y la skill…») under its title; it is part of the card, not a separate index.
var Render = (function () {
  var USER = "Persona del equipo";
  var TEAM = "Equipo";
  var MODEL = "Sonnet 5.5";  // the chat's model chip, unless the episode names one (workspace.model)
  var BRANCH = "main";

  // ---- DOM helpers (text only) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;

    }

    function cells(line) { return line.slice(1, -1).split("|").map(function (c) { return c.trim(); }); }
    function tableRow(line) {
      if (!table) {

        var t = el("table");
        table.head = el("thead");
        add(t, table.head, table.body);
        frag.appendChild(add(el("div", "ws-md-table"), t));

      if (/^\|[\s:|-]+\|$/.test(line) && table.last && !table.head.firstChild) {
        var head = table.last;
        Array.prototype.forEach.call(head.children, function (td) {
          var th = el("th");
          while (td.firstChild) th.appendChild(td.firstChild);

  }

  function step(container, ep, index) {
    while (container.firstChild) container.removeChild(container.firstChild);
    container.appendChild(build(ep, index));
    return container.firstChild;
  }

  var api = {step: step, markdown: markdown, clockText: clockText,
             now: function () { return new Date(); }};
  return api;
})();

</script>
<script>
// Forward animation of ONE step, plus the playback policy as pure functions.
//
// Animate.run(container, episode, index, opts) -> {cancel(), done: Promise}
//   Renders the finished state with Render.step(container, episode, index), hides the
//   current step's hooks (see render.js header) and reveals them in document order on
//   the injected scheduler, so it looks like the step at `index` playing on top of
//   Render.step(index - 1). Both completion and cancel() end with a fresh
//   Render.step(container, episode, index): the final DOM is identical by construction.
//   `done` resolves in both cases (never rejects). A new run on the same container
//   cancels the previous one first, and a reveal that throws ends the run in the final
//   state too.
// Animate.stop(container): cancels the active run on `container` without rendering
//   (call it before a static Render.step, e.g. on a back-step).
//   opts: {speed = 1 (clamped to >= 0.1), schedule(fn, ms) -> id = setTimeout,
//          unschedule(id) = clearTimeout, now() = Date.now (accepted, not used: every
//          wait goes through schedule)}.
//
// Timing (every value is divided by speed):
//   type  28 ms per character (code points), the text grows one character per tick
//   line  120 ms per line / say block
//   node  250 ms, then the node appears whole (tool, worked, chips)
//   fade  250 ms for a card, an approve window and a page: opacity 0 until the tick
//   autoplay delay between steps 900 ms
// Animate.stepDuration walks the same plan the animation schedules, so the estimate
// and the playback cannot drift apart.
var Animate = (function () {
  var CHAR_MS = 28;
  var LINE_MS = 120;
  var NODE_MS = 250;
  var FADE_MS = 250;
  var AUTOPLAY_MS = 900;
  var MIN_SPEED = 0.1;

  function speedOf(s) {
    s = Number(s);
    if (!(s > 0)) s = MIN_SPEED;
    return Math.max(s, MIN_SPEED);
  }
  function chars(text) { return Array.from(String(text || "")); }
  function hide(n) { n.style.display = "none"; }
  function show(n) { n.style.display = ""; }

  // Render the finished state into `container`, hide what the step at `index` adds and
  // return the reveal plan: [{ms, fn}] in order (ms already divided by speed).
  function prepare(container, ep, index, speed) {
    Render.step(container, ep, index);
    var flat = Nav.flatten(ep);
    if (!flat.length) return [];
    var e = flat[Nav.clamp(ep, index)];
    var plan = [];
    var screen = container.firstChild;
    if (e.step === -1) {
      screen.style.opacity = "0";
      plan.push({ms: FADE_MS / speed, fn: function () { screen.style.opacity = "1"; }});
      return plan;
    }
    var root = container.querySelector('[data-step="' + e.step + '"]');
    if (!root) return plan;
    var step = ep.chapters[e.chapter].steps[e.step];
    // The idle prompt lives in the zsh panel (cursor-full) and on the terminal screen: hide
    // it only when this step plays in that same flow, not for a chat-placed agent command.
    // On claude-code, `in: "zsh"` is the person's `!` line and there is no idle prompt, so
    // the lookup below finds nothing.
    if (step.type === "term" && (step["in"] === "zsh" || ep.chapters[e.chapter].screen === "terminal")) {
      var idle = container.querySelector('[data-anim="idle"]');
      if (idle) hide(idle);
    }
    var hooks = [];
    if (root.hasAttribute("data-anim")) hooks.push(root);
    Array.prototype.forEach.call(root.querySelectorAll("[data-anim]"), function (n) { hooks.push(n); });
    hooks.forEach(function (n) {
      var kind = n.getAttribute("data-anim");
      if (kind === "type") {
        var cs = chars(n.textContent);
        n.textContent = "";
        cs.forEach(function (_, k) {
          plan.push({ms: CHAR_MS / speed, fn: function () { n.textContent = cs.slice(0, k + 1).join(""); }});
        });
      } else if (kind === "line") {
        hide(n);
        plan.push({ms: LINE_MS / speed, fn: function () { show(n); }});
      } else if (kind === "node" && (step.type === "approve" || step.type === "page") && n === root) {
        n.style.opacity = "0";
        plan.push({ms: FADE_MS / speed, fn: function () { n.style.opacity = "1"; }});
      } else if (kind === "node") {
        hide(n);
        plan.push({ms: NODE_MS / speed, fn: function () { show(n); }});
      }
    });
    return plan;
  }

  // One active run per container: a new run (or stop) cancels the previous one first.
  var active = typeof WeakMap === "function" ? new WeakMap() : null;
  function getActive(c) { return active ? active.get(c) : c.__wsAnimRun; }
  function setActive(c, r) { if (active) active.set(c, r); else c.__wsAnimRun = r; }
  function clearActive(c, r) {
    if (getActive(c) !== r) return;
    if (active) active.delete(c); else delete c.__wsAnimRun;
  }

  // Cancel any active run on `container` without rendering (its `done` resolves).
  function stop(container) {
    var r = getActive(container);
    if (r) r.abort();
  }

  function run(container, ep, index, opts) {
    opts = opts || {};
    stop(container);
    var speed = speedOf(opts.speed === undefined ? 1 : opts.speed);
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var finished = false, timer = null, resolveDone;
    var done = new Promise(function (resolve) { resolveDone = resolve; });
    var handle = {cancel: function () { end(true); }, done: done, abort: function () { end(false); }};
    setActive(container, handle);
    var plan = prepare(container, ep, index, speed);

    function end(render) {
      if (finished) return;
      finished = true;
      if (timer !== null) { unschedule(timer); timer = null; }
      clearActive(container, handle);
      if (render) Render.step(container, ep, index);
      resolveDone();
    }
    function next(k) {
      if (finished) return;
      if (k >= plan.length) { end(true); return; }
      timer = schedule(function () {
        timer = null;
        if (finished) return;
        try {
          plan[k].fn();
        } catch (err) {
          // A broken reveal must not stall playback: jump to the final state.
          if (typeof console !== "undefined") console.error("Animate: reveal failed", err);
          end(true);
          return;
        }
        next(k + 1);
      }, plan[k].ms);
    }
    next(0);
    return {cancel: handle.cancel, done: done};
  }

  // Sum of the ms the animation of `index` schedules (same plan, detached container).
  function stepDuration(ep, index, speed) {
    var plan = prepare(document.createElement("div"), ep, index, speedOf(speed));
    return plan.reduce(function (s, a) { return s + a.ms; }, 0);
  }

  // What autoplay does after `index` finished animating.
  function autoplay(ep, index, speed) {
    var flat = Nav.flatten(ep);
    var i = Nav.clamp(ep, index);
    if (!flat.length || i >= flat.length - 1) return {stop: true, delay: 0};
    var e = flat[i];
    var steps = ep.chapters[e.chapter].steps || [];
    if (e.step === steps.length - 1) return {stop: true, delay: 0};  // also an empty chapter's card
    if (e.step >= 0 && steps[e.step].pause) return {stop: true, delay: 0};
    return {stop: false, delay: AUTOPLAY_MS / speedOf(speed)};
  }

  // Estimated length: step animations plus autoplay delays (none after a stop).
  function episodeDuration(ep, speed) {
    var flat = Nav.flatten(ep);
    var chapters = (ep.chapters || []).map(function (ch) { return {id: ch.id, ms: 0}; });
    var total = 0;
    flat.forEach(function (e, i) {
      var a = autoplay(ep, i, speed);
      var ms = stepDuration(ep, i, speed) + (a.stop ? 0 : a.delay);
      chapters[e.chapter].ms += ms;
      total += ms;
    });
    return {total: total, chapters: chapters};
  }

  return {run: run, stop: stop, stepDuration: stepDuration, autoplay: autoplay, episodeDuration: episodeDuration,
          CHAR_MS: CHAR_MS, LINE_MS: LINE_MS, NODE_MS: NODE_MS, FADE_MS: FADE_MS, AUTOPLAY_MS: AUTOPLAY_MS};
})();

</script>
<script>
// Stage page: what the audience sees. It holds (episode, index), renders or animates on
// `show` and answers the control. Messages (see the episode format):
//   in : {type:"show", episode, index, animate, speed} | {type:"blackout", on} | {type:"ping"}
//        {type:"wait", delay, seq} | {type:"wait-cancel"}
//   out: {type:"ready"} on load, {type:"shown", episode, index}, then
//        {type:"done-animating", index} (only for the latest show), {type:"pong"},
//        {type:"advance", seq} when a wait ends,
//        {type:"key", key, shift} for the presenter's keys pressed while the stage has focus.
// The stage times the autoplay delay (`wait`) because its window is the visible one:
// the control's timers may be throttled while the stage has focus. A new show, a new wait
// or wait-cancel drops the pending wait.
// A `show` animates only when animate is true and index == current + 1 in the same
// episode; anything else cancels the running animation and renders the finished state.
// The stage never shows notes, sources or the skill commit: it only calls Render.step.
//
// Stage.create(opts) -> {handle(msg) -> Promise, current()} is the testable core:
//   opts: {canvas (Render container), blackout (element toggled with .hidden), episodes,
//          post(msg), schedule?, unschedule? (passed to Animate.run)}.
// Stage.tickClock(canvas) sets the idle prompt's time text (.ws-time inside
//   [data-anim="idle"]) to Render.now(); it touches nothing else, so it never re-renders
//   a step or disturbs a running animation. The page calls it every second.
// Stage.localMove(ep, index, key, shift) -> {index, animate} | null: where the presenter
//   keys go when no control drives the page (opened from its link). → / PageDown / space
//   step forward animated, ← / PageUp step back finished, shift jumps chapters; null at
//   the ends or for any other key. Stage.hashFor(id, index) is the "#id/N" parseHash reads.
// The DOM bootstrap at the end runs only on the page with #ws-stage-root. The page is
// driven when the control opened it (window "ws-stage" with an opener); otherwise it
// navigates by itself and keeps the step in the hash, so a reload stays put.
var Stage = (function () {
  var FADE = "ws-fade-in";

  function create(opts) {
    var canvas = opts.canvas, blackout = opts.blackout;
    var post = opts.post || function () {};
    var byId = {};
    (opts.episodes || []).forEach(function (ep) { if (ep && ep.id) byId[ep.id] = ep; });
    var cur = null;   // {episode, index} of the latest show
    var seq = 0;      // id of the latest show; older runs stay silent
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var waiting = null;  // timer id of the pending wait
    function cancelWait() {
      if (waiting !== null) { unschedule(waiting); waiting = null; }
    }
    function onWait(msg) {
      cancelWait();
      var delay = Math.max(Number(msg.delay) || 0, 0);
      waiting = schedule(function () {
        waiting = null;
        post({type: "advance", seq: msg.seq});
      }, delay);
    }
    if (blackout) blackout.hidden = true;

    function fades(ep, index) {
      var e = Nav.flatten(ep)[index];
      return !!e && (e.kind === "card" || e.kind === "approve" || e.kind === "page");
    }

    function onShow(msg) {
      var ep = byId[msg.episode];
      if (!ep) return Promise.resolve();
      var index = Nav.clamp(ep, msg.index);
      var id = ++seq;
      cancelWait();
      var animate = msg.animate === true && cur !== null && cur.episode === ep.id && index === cur.index + 1;
      cur = {episode: ep.id, index: index};
      canvas.classList.remove(FADE);
      if (!animate) {
        Animate.stop(canvas);
        Render.step(canvas, ep, index);
        post({type: "shown", episode: ep.id, index: index});
        post({type: "done-animating", index: index});
        return Promise.resolve();
      }
      var speed = Math.max(Number(msg.speed) || 1, 0.1);
      if (fades(ep, index)) {
        canvas.style.setProperty("--ws-fade-ms", Math.round(Animate.FADE_MS / speed) + "ms");
        canvas.classList.add(FADE);
      }
      var run = Animate.run(canvas, ep, index, {speed: speed, schedule: schedule, unschedule: unschedule});
      post({type: "shown", episode: ep.id, index: index});
      return run.done.then(function () {
        if (id !== seq) return;
        // Same task as Animate's final render: the fresh node never starts the fade.
        canvas.classList.remove(FADE);
        post({type: "done-animating", index: index});
      });
    }

    function handle(msg) {
      if (!msg || typeof msg !== "object") return Promise.resolve();
      if (msg.type === "show") return onShow(msg);
      if (msg.type === "blackout") { if (blackout) blackout.hidden = !msg.on; }
      else if (msg.type === "ping") post({type: "pong"});
      else if (msg.type === "wait") onWait(msg);
      else if (msg.type === "wait-cancel") cancelWait();
      return Promise.resolve();
    }

    return {handle: handle, current: function () { return cur; }};
  }

  // Refresh only the idle prompt's clock text; returns how many were updated.
  function tickClock(canvas) {
    var text = Render.clockText(Render.now());
    var spans = canvas.querySelectorAll('[data-anim="idle"] .ws-time');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].textContent !== text) spans[i].textContent = text;
    }
    return spans.length;
  }

  // The keydown the stage forwards to the control, or null.
  function keyMessage(ev) {
    if (!ev || !Nav.keyAction(ev.key) || ev.repeat || ev.metaKey || ev.ctrlKey || ev.altKey) return null;
    return {type: "key", key: ev.key, shift: !!ev.shiftKey};
  }

  // Static preview hook: "#<episode-id>/<step>" -> {episode, index}, or null. The step is
  // 1-based, like the "paso N de M" on the control: #id/1 is index 0 (#id/0 is rejected).
  function parseHash(hash) {
    var m = /^#([A-Za-z0-9._-]+)\/(\d+)$/.exec(typeof hash === "string" ? hash : "");
    var n = m ? parseInt(m[2], 10) : 0;
    return n >= 1 ? {episode: m[1], index: n - 1} : null;
  }

  function localMove(ep, index, key, shift) {
    var k = Nav.keyAction(key), last = Nav.flatten(ep).length - 1, target;
    if ((k === "right" || k === "left") && shift) {
      target = k === "right" ? Nav.nextChapter(ep, index) : Nav.prevChapter(ep, index);
      return target === index ? null : {index: target, animate: false};
    }
    if (k === "right" || k === "space") return index >= last ? null : {index: index + 1, animate: true};
    if (k === "left") return index <= 0 ? null : {index: index - 1, animate: false};
    return null;
  }

  function hashFor(id, index) { return "#" + id + "/" + (index + 1); }

  function readEpisodes() {
    var node = document.getElementById("episodes");
    if (!node) return [];
    try {
      var data = JSON.parse(node.textContent);
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  // Scale the 1600x900 frame to fit the window, letterboxed on black.
  function fit(frame) {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }

  function boot() {
    if (!document.getElementById("ws-stage-root")) return;
    var frame = document.getElementById("ws-frame");
    var opener = window.name === "ws-stage" ? window.opener : null;
    function post(msg) { if (opener && !opener.closed) opener.postMessage(msg, "*"); }
    var canvas = document.getElementById("ws-canvas");
    var blackout = document.getElementById("ws-blackout");
    var episodes = readEpisodes();
    var stage = create({canvas: canvas, blackout: blackout, episodes: episodes, post: post});
    window.addEventListener("message", function (ev) {
      if (!opener || ev.source !== opener) return;
      stage.handle(ev.data);
    });
    document.addEventListener("keydown", function (ev) {
      var msg = keyMessage(ev);
      if (!msg) return;
      ev.preventDefault();
      if (opener) post(msg);
      else moveAlone(msg);
    });
    function moveAlone(msg) {
      if (Nav.keyAction(msg.key) === "b") { blackout.hidden = !blackout.hidden; return; }
      var cur = stage.current(), ep = null;
      episodes.forEach(function (e) { if (cur && e.id === cur.episode) ep = e; });
      var to = ep && localMove(ep, cur.index, msg.key, msg.shift);
      if (!to) return;
      history.replaceState(null, "", hashFor(ep.id, to.index));
      stage.handle({type: "show", episode: ep.id, index: to.index, animate: to.animate, speed: 1});
    }
    setInterval(function () { tickClock(canvas); }, 1000);
    fit(frame);
    window.addEventListener("resize", function () { fit(frame); });
    if (!opener) {
      // No control driving this page: the hash picks the finished step to show (the first one
      // without a hash) and the presenter keys move from there (moveAlone).
      var preview = function () {
        var h = parseHash(location.hash) || (episodes[0] ? {episode: episodes[0].id, index: 0} : null);
        if (h) stage.handle({type: "show", episode: h.episode, index: h.index, animate: false});
      };
      window.addEventListener("hashchange", preview);
      preview();
    }
    post({type: "ready"});
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  return {create: create, keyMessage: keyMessage, parseHash: parseHash, tickClock: tickClock,
          localMove: localMove, hashFor: hashFor};
})();

</script>
