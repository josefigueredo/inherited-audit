name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    # Pinned: ubuntu-latest is 26.04, where setup-python has no 3.9 (macOS's /usr/bin/python3); 24.04 still has it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A developer machine can carry a global git hook (an identity check, a linter) that rejects the fixtures'
      # commits. Run the suite under one that rejects every commit, so a fixture that is not hermetic fails here.
      - name: Install a hostile global git hook
        run: |
          mkdir -p "$RUNNER_TEMP/hostile-hooks"
          printf '#!/bin/sh\necho "rejected by the hostile global hook" >&2\nexit 1\n' > "$RUNNER_TEMP/hostile-hooks/pre-commit"
          chmod +x "$RUNNER_TEMP/hostile-hooks/pre-commit"
          git config --global core.hooksPath "$RUNNER_TEMP/hostile-hooks"
      - name: Run tests
        run: python -m unittest discover -s tests -v
